<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一場沒有人來的告別式</title>
<meta name="description" content="你點過的連結，有些已經悄悄死掉了。6 分鐘，領取你的數位告別人格。">
<meta property="og:title" content="一場沒有人來的告別式｜測出你的數位告別人格">
<meta property="og:description" content="你點過的連結，有些已經悄悄死掉了。6 分鐘，領取你的數位告別人格。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<style>
:root{
  --bg:#000; --bg2:#0b0b0b; --line:#3a3a3a; --ink:#bdbdbd; --hi:#e6e6e6; --muted:#8a8a8a; --faint:#555;
  --g:#4ed46a; --c:#3fc8c8; --y:#e3d84a; --m:#cf5acf; --r:#d9534a; --blue:#2135a8;
  /* 舊變數名保留成別名，避免 JS 裡的 inline style 失效 */
  --amber:var(--g); --dead:var(--r); --alive:var(--g); --cyan:var(--c);
  --mono:"MingLiU","PMingLiU","細明體","IBM Plex Mono","Noto Sans TC",monospace;
  --latin:"IBM Plex Mono","MingLiU",monospace;
  --serif:var(--mono); --sans:var(--mono);
  --chroma:-1px 0 rgba(255,40,120,.6),1px 0 rgba(40,230,230,.55);
}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:var(--ink);font-family:var(--mono);-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;font-size:15px;line-height:1.6}
/* CRT：掃描線、暗角、雜訊 */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:51;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.7) 100%)}
.noise{position:fixed;inset:0;pointer-events:none;z-index:52;opacity:.07;mix-blend-mode:screen;background-size:160px}
button{font:inherit;color:inherit}
::selection{background:var(--g);color:#000}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 120px;min-height:100dvh;display:flex;flex-direction:column;animation:flick 7s infinite}
@keyframes flick{0%,95%,100%{opacity:1}96%{opacity:.7}97%{opacity:.95}}
.demo{background:#2a2600;color:var(--y);font-size:12px;text-align:center;padding:4px 16px}
.cur{animation:blink 1s steps(1) infinite;color:var(--g)}
@keyframes blink{50%{opacity:0}}
.ascii{font-family:var(--latin);font-size:13px;line-height:1.15;color:var(--muted);margin:0;white-space:pre;overflow:hidden}
.rot{opacity:.3}

/* 標題 glitch：平常靜止，JS 隨機加 .on 發作 → RGB 錯位 + 橫切位移；「別」「░」同時換成亂碼 */
.glitch{position:relative}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;inset:0;white-space:pre-line;pointer-events:none;opacity:0;text-shadow:none;mix-blend-mode:screen}
.glitch::before{color:#ff2878}
.glitch::after{color:#28e6e6}
.glitch.on{animation:gj .45s steps(1) both}
.glitch.on::before{opacity:.9;animation:gs1 .45s steps(1) both}
.glitch.on::after{opacity:.9;animation:gs2 .45s steps(1) both}
@keyframes gj{0%,35%,80%,100%{transform:none}10%{transform:translateX(-2px) skewX(-6deg)}20%{transform:translateX(3px)}50%{transform:translate(-1px,1px) skewX(4deg)}65%{transform:translateX(2px)}}
@keyframes gs1{0%{clip-path:inset(10% 0 70% 0);transform:translateX(-6px)}15%{clip-path:inset(55% 0 20% 0);transform:translateX(5px)}30%{clip-path:inset(30% 0 50% 0);transform:translateX(-3px)}45%{clip-path:inset(80% 0 5% 0);transform:translateX(8px)}60%{clip-path:inset(0 0 85% 0);transform:translateX(-4px)}75%{clip-path:inset(40% 0 35% 0);transform:translateX(3px)}100%{clip-path:inset(50% 0 50% 0);transform:none}}
@keyframes gs2{0%{clip-path:inset(65% 0 10% 0);transform:translateX(5px)}15%{clip-path:inset(5% 0 75% 0);transform:translateX(-7px)}30%{clip-path:inset(45% 0 30% 0);transform:translateX(4px)}45%{clip-path:inset(20% 0 60% 0);transform:translateX(-5px)}60%{clip-path:inset(70% 0 0 0);transform:translateX(6px)}75%{clip-path:inset(15% 0 70% 0);transform:translateX(-2px)}100%{clip-path:inset(50% 0 50% 0);transform:none}}
.rot.hot,.scr.hot{opacity:1}
.glitch .rot.hot{color:var(--r)}

/* 上方：PTT 藍色標題列 */
.top{position:sticky;top:0;z-index:5;margin:0 -14px 12px;background:var(--blue);color:var(--hi);padding:2px 10px;display:flex;align-items:center;gap:6px;min-height:44px}
.back{background:none;border:0;color:var(--hi);font-size:13px;padding:6px 2px;cursor:pointer;min-width:44px;min-height:40px;text-align:left}
.back[hidden]{visibility:hidden;display:block}
.acts{flex:1;display:flex;gap:1px;justify-content:center;font-size:12px}
.acts i{font-style:normal;padding:0 1px;color:#7f8ad6}
.acts i::before{content:"["}.acts i::after{content:"]"}
.acts i.done{color:var(--y)}
.acts i.now{color:#000;background:var(--g)}
.acts i.pop{animation:pop .6s steps(3) both}
@keyframes pop{0%,66%{background:var(--y);color:#000}}
.actlabel{font-size:12px;color:var(--y);white-space:nowrap;min-width:52px;text-align:right}
.stamp{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--y);color:var(--y);padding:4px 10px;font-size:13px;margin:0 0 6px;animation:in .5s steps(3) both}
.stamp b{font-weight:400}
.stamp b::before{content:"⊕"}

main{flex:1;display:flex;flex-direction:column}
.screen{animation:in .3s steps(3) both}
@keyframes in{from{opacity:0}to{opacity:1}}

h1{font-weight:700;font-size:clamp(26px,7.4vw,32px);line-height:1.35;margin:22px 0 16px;color:var(--hi);text-shadow:var(--chroma)}
.lead{font-size:15px;line-height:1.85}
.lead p{margin:0 0 10px}
.lead p::before{content:"※ ";color:var(--y)}
.muted{color:var(--muted)}
.small{font-size:13px;line-height:1.7}
.meta{list-style:none;padding:0;margin:0;font-size:14px;line-height:1.9}
.meta li::before{content:"⊕ ";color:var(--c)}
.box{position:relative;border:1px solid var(--c);padding:16px 12px 10px;margin:20px 0}
.box>.bt{position:absolute;top:-.85em;left:10px;background:#000;color:var(--c);padding:0 4px;font-size:13px}
.conn{font-size:12px;color:var(--muted);line-height:1.6}
.conn .ok{color:var(--g)} .conn .bad{color:var(--r)}
.banner{text-align:center;font-family:var(--latin);font-size:clamp(15px,5.2vw,22px);line-height:1;margin:20px 0 6px;white-space:pre;text-shadow:-1.5px 0 rgba(255,40,120,.55),1.5px 0 rgba(40,230,230,.5);overflow:hidden}

/* 幕間 */
.act{text-align:left;padding-top:3vh}
.act .num{color:var(--g);font-size:13px;letter-spacing:.2em}
.act h2{font-weight:700;font-size:30px;margin:4px 0 14px;color:var(--hi);text-shadow:var(--chroma)}
.act .art{margin:4px 0 22px}
.act blockquote{margin:0;border:1px solid var(--g);padding:18px 12px 14px;position:relative;font-size:15px;line-height:1.85;color:var(--c)}
.act blockquote::before{content:"┤ 系統訊息 ├";position:absolute;top:-.85em;left:10px;background:#000;color:var(--g);padding:0 4px;font-size:12px}
.act blockquote .muted{color:var(--muted)}

/* 題目 */
.q{margin-bottom:30px}
.qt{font-size:17px;color:var(--hi);line-height:1.65;margin:8px 0 6px}
.qt::before{content:"> ";color:var(--g)}
.req{color:var(--y);font-size:12px;margin-left:6px;vertical-align:1px}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px;line-height:1.6}
.opts{display:flex;flex-direction:column;margin:12px -14px 0;counter-reset:o}
.opt{position:relative;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px;text-align:left;background:transparent;border:0;padding:11px 14px 11px 2.6em;cursor:pointer;min-height:48px;color:var(--ink);counter-increment:o}
.opt::before{content:"(" counter(o) ")";color:var(--muted);flex:none}
.opt:hover:not(.on):not(:disabled){background:#121212}
.opt.on{background:var(--g);color:#000}
.opt.kb:not(.on){background:#121212;outline:1px dashed var(--g);outline-offset:-1px}
.opt.kb:not(.on)::after{content:"▸";position:absolute;left:1em;top:11px;color:var(--g)}
.opt.kb.on{outline:1px dashed #000;outline-offset:-3px}
.grid .row.kb{outline:1px dashed var(--g);outline-offset:2px}
.opt.on::before{color:#000}
.opt.on::after{content:"●";position:absolute;left:1em;top:11px}
.opt.multi::before{content:"[ ]"}
.opt.multi.on::before{content:"[*]"}
.opt .ol{font-size:15px}
.opt .os{font-size:12px;color:var(--muted);flex-basis:100%}
.opt.on .os{color:#0e3d18}
.opt:disabled{opacity:.3;cursor:not-allowed}
.opt:focus-visible,.scale button:focus-visible,.grid .cells button:focus-visible,.btn:focus-visible,.back:focus-visible{outline:1px dashed var(--hi);outline-offset:-3px}
.echo{font-size:12px;color:var(--muted);margin-top:8px}
.echo .ok{color:var(--g)}
.echo.react{color:var(--y);font-size:13px}

.scale{display:flex;gap:4px;margin-top:12px}
.scale button{flex:1;background:transparent;border:1px solid var(--line);height:46px;cursor:pointer;font-size:15px;padding:0;color:var(--ink)}
.scale button.on{background:var(--g);color:#000;border-color:var(--g);font-weight:700}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;gap:12px}
.ends span:last-child{text-align:right}

.links{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:14px 0 6px}
.links i{height:34px;background:#111;border:1px solid var(--line);position:relative;cursor:pointer}
.links i.alive{background:var(--g);border-color:var(--g)}
.links i.dead::after{content:"░";position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-style:normal}
.big{font-family:var(--latin);font-size:42px;color:var(--g);text-align:center;margin:6px 0 0;text-shadow:var(--chroma)}

.grid .row{border:1px solid var(--line);padding:12px;margin-top:10px}
.grid .row.on{border-color:#2f6b3a}
.grid .st{font-size:14px;line-height:1.6;margin-bottom:10px;color:var(--hi)}
.grid .cells{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.grid .cells button{background:transparent;border:1px solid var(--line);padding:6px 2px;font-size:12px;line-height:1.3;cursor:pointer;min-height:44px;color:var(--muted)}
.grid .cells button.on{background:var(--g);border-color:var(--g);color:#000}

input[type=text],input[type=email],textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:0;color:var(--hi);font:inherit;font-size:16px;padding:12px 14px;margin-top:12px;outline:none;caret-color:var(--g)}
input:focus,textarea:focus{border-color:var(--g)}
::placeholder{color:#666}
textarea{min-height:120px;resize:vertical;line-height:1.7}
.check{display:flex;gap:12px;align-items:flex-start;margin-top:14px;cursor:pointer;font-size:15px;line-height:1.7}
.check input{width:20px;height:20px;accent-color:var(--g);margin-top:4px;flex:none}
.err{color:var(--r);font-size:14px;margin-top:10px;min-height:1em}

/* 打字機：字還沒打完前，選項先藏起來 */
.screen.typing .opts,.screen.typing .scale,.screen.typing .ends,.screen.typing .grid,.screen.typing .links,.screen.typing .big,.screen.typing input,.screen.typing textarea,.screen.typing .check,.screen.typing .bbs,.screen.typing .witness,.screen.typing .hint,.screen.typing .echo{visibility:hidden}

/* 選項逐行印出：打字機打完後，提示、選項、量表一行一行「印」出來 */
.screen.reveal :is(.hint,.opt,.scale button,.ends,.grid .row,.links i,.big,input,textarea,.check,.bbs,.witness,.echo){animation:printin .22s steps(5) both;animation-delay:calc(120ms + min(var(--i,0),14) * 70ms)}
@keyframes printin{0%{opacity:0;clip-path:inset(0 100% 0 0)}1%{opacity:1}100%{opacity:1;clip-path:inset(0)}}
/* 同一個畫面重新渲染（點選項、勾選）時不要再淡入一次 */
.screen.still{animation:none}
/* 單選後自動跳題：選中的閃兩下確認，其他選項暗下去 */
.screen.picked .opt:not(.on){animation:dim .2s steps(2) both}
@keyframes dim{to{opacity:.2}}
.screen.picked .opt.on{animation:sel .4s steps(1) both}
@keyframes sel{25%,75%{background:transparent;color:var(--g)}50%,100%{background:var(--g);color:#000}}

/* 像素圖 */
.px{font-family:"IBM Plex Mono",Consolas,"Courier New",monospace;line-height:1.08;letter-spacing:0;font-size:11px;text-shadow:-1px 0 rgba(255,40,120,.28),1px 0 rgba(40,230,230,.24);animation:pxin .55s steps(9) both}
@keyframes pxin{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
.screen.still .px{animation:none}
pre.px.banner{font-size:clamp(9px,3.4vw,15px);line-height:1.08;margin:18px 0 8px}
.side-art pre.px{font-size:clamp(8px,.82vw,12px)}
.side-art.big pre.px{font-size:clamp(10px,1.1vw,16px)}
.persona .emo pre.px{font-size:12px}

/* 下方按鈕 */
.nav{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#000;border-top:1px solid #1d1d1d;display:flex;justify-content:center;z-index:5}
.nav .inner{max-width:532px;width:100%}
.btn{width:100%;background:var(--g);color:#000;border:0;border-radius:0;height:52px;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:.04em}
.btn::before{content:"▌ "}.btn::after{content:" ▐"}
.btn:disabled{background:#161616;color:#5a5a5a;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--c);color:var(--c)}
.btn.ghost::before{content:"[ "}.btn.ghost::after{content:" ]"}

/* 同意書 */
.doc{position:relative;border:1px solid var(--c);padding:18px 14px 14px;font-size:14px;line-height:1.85;margin:20px 0}
.doc::before{content:"┤ 入場須知 ├";position:absolute;top:-.85em;left:10px;background:#000;color:var(--c);padding:0 4px;font-size:13px}
.doc h3{font-size:14px;color:var(--y);margin:14px 0 2px;font-weight:400}
.doc h3::before{content:"※ "}
.doc h3:first-child{margin-top:0}
.doc p{margin:0}

/* 題目內的 PTT 文章 */
.bbs{font-size:12px;line-height:1.75;background:#000;border:1px solid var(--line);padding:10px 12px;margin:14px 0;overflow:hidden}
.bbs .h{display:flex;gap:8px}
.bbs .k{background:var(--blue);color:var(--hi);padding:0 5px}
.bbs .v{color:var(--hi)}
.bbs .hr{color:#444;white-space:nowrap;overflow:hidden}
.bbs .lnk{color:var(--c);text-decoration:line-through;text-decoration-color:var(--r)}
.bbs .tag404{background:var(--r);color:#000;margin-left:6px;padding:0 3px}
.bbs .push{color:var(--hi);font-weight:700}.bbs .pid{color:var(--y)}
.bbs .fade{opacity:.45}.bbs .fade2{opacity:.2}
.witness{display:grid;place-items:center;margin:18px 0 6px}
.witness span{border:3px double var(--r);color:var(--r);padding:14px 26px;font-size:20px;letter-spacing:.3em;animation:wp 1.6s steps(1) infinite}
@keyframes wp{50%{background:var(--r);color:#000}}
.flame{animation:blink 1.4s steps(1) infinite}

/* 揭曉 */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}
.compare div{border:1px solid var(--line);padding:12px;text-align:center}
.compare b{display:block;font-family:var(--latin);font-size:30px;color:var(--g);margin:4px 0;text-shadow:var(--chroma)}
.compare .real b{color:var(--r)}

/* 結果 */
.persona{text-align:center;padding-top:6px}
.persona .emo{display:flex;justify-content:center;margin:14px 0 6px}
.persona h2{font-weight:700;font-size:40px;margin:6px 0 4px;color:var(--g);text-shadow:-2px 0 rgba(255,40,120,.6),2px 0 rgba(40,230,230,.55)}
.persona p{font-size:15px;line-height:1.85;margin:12px 0 0;text-align:left;color:var(--hi)}
.rar{display:block;margin-top:4px;font-size:13px;color:var(--y)}
.rar b{color:var(--hi);font-weight:400}
.story{margin:22px 0 0;color:var(--c);line-height:1.85;font-size:15px}
.story::before{content:"※ 引述《你的作答》之銘言：";display:block;color:var(--y);font-size:13px;margin-bottom:2px}
.sec{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--hi);margin:30px 0 10px}
.sec::after{content:"";flex:1;border-top:1px solid var(--line)}
.dimbars{font-family:var(--latin);font-size:14px;display:flex;flex-direction:column;gap:4px;max-width:420px;text-align:left}
.dimbars div{display:grid;grid-template-columns:5.6em minmax(0,1fr) 2.2em;gap:6px}
.dimbars div span:first-child{font-family:var(--mono)}
.dimbars b{font-weight:400;text-align:right;color:var(--hi)}
.stats{margin:18px 0}
.stat{margin-bottom:16px}
.stat .lbl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.stat .lbl span::before{content:"推 ";color:var(--hi);font-weight:700}
.stat .lbl b{color:var(--y);font-weight:400}
.bar{height:10px;background:repeating-linear-gradient(90deg,#262626 0 7px,transparent 7px 9px)}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--g) 0 7px,transparent 7px 9px);width:0;transition:width 1.2s steps(20)}
.stat .say{font-size:13px;color:#c9c04a;margin-top:4px}
.stat .say::before{content:": "}
.iv{position:relative;border:1px solid var(--c);padding:20px 12px 12px;margin:30px 0}
.iv::before{content:"┤ 站內信 (1) ├";position:absolute;top:-.85em;left:10px;background:#000;color:var(--c);padding:0 4px;font-size:13px}
.iv h3{font-size:16px;color:var(--hi);margin:0 0 8px}
.iv textarea{min-height:72px}
.relics{display:flex;justify-content:center;gap:4px 8px;font-size:12px;margin-top:4px;flex-wrap:wrap;color:var(--y)}

/* 告別人格證明（可存成圖片） */
.card{background:#000;color:var(--ink);font-family:var(--mono);width:100%;max-width:340px;margin:10px auto 18px;padding:20px 18px 22px;font-size:13px;line-height:1.7;position:relative;border:3px double var(--g)}
.card .c{text-align:center}
.card .t{font-weight:700;font-size:20px;letter-spacing:.3em;margin:2px 0;color:var(--hi)}
.card .dash{border-top:1px dashed #444;margin:12px 0}
.card .kv{display:flex;justify-content:space-between}
.card .kv span:last-child{color:var(--hi)}
.card .pn{font-weight:700;font-size:26px;text-align:center;margin:6px 0 2px;color:var(--g)}
.card .ep{text-align:center;font-size:15px;margin:4px 0;color:var(--y)}
.card .foot{text-align:center;font-size:11px;color:#777}
.card .dimbars{font-size:12px}
.share{display:flex;gap:10px}
.share .btn{font-size:15px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.7}
footer{font-size:11px;color:#555;text-align:center;padding:30px 0 0}
.spin{margin:22vh auto 12px;text-align:center;color:var(--g);font-family:var(--latin);font-size:30px;height:40px}
.spin::before{content:"|";animation:sp .8s steps(1) infinite}
@keyframes sp{0%{content:"|"}25%{content:"/"}50%{content:"-"}75%{content:"\\"}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- 平板／電腦版 ---------- */
.cover-art{margin:0 auto}
@media (min-width:600px) and (max-width:959px){ .wrap{max-width:640px} .nav .inner{max-width:608px} }
#aside{display:none}
.side-num{color:var(--g);letter-spacing:.2em;font-size:14px}
.side-title{font-weight:700;font-size:clamp(32px,3.2vw,48px);line-height:1.3;margin:8px 0 0;color:var(--hi);text-shadow:var(--chroma)}
.side-art{margin:28px 0}
.side-art .ascii{font-size:clamp(13px,1.1vw,16px)}

/* 打字完之後，提示與選項逐行印出（只在畫面第一次出現時） */
function revealRest(root){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  root.querySelectorAll('.hint,.opt,.scale button,.ends,.grid .row,.links i,.big,input,textarea,.check,.bbs,.witness,.echo')
      .forEach((el,i)=>el.style.setProperty('--i', i));
  root.classList.add('reveal');
}

/* 打字機：每個畫面第一次出現時，把題目和幕間文字逐字印出；點一下畫面可以跳過 */
const TYPE_MS = 18;
let typedScreen = null, typeTimer = null, typeSkip = null;
function typewriter(root){
  clearInterval(typeTimer); typeSkip = null;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const targets = [...root.querySelectorAll('.qt, .act blockquote, .story')];
  if (!targets.length){ revealRest(root); return; }
  const nodes = [];
  targets.forEach(t=>{ const w = document.createTreeWalker(t, NodeFilter.SHOW_TEXT); let n; while((n=w.nextNode())){ if(n.parentElement.closest('.req')) continue; nodes.push([n, n.nodeValue]); n.nodeValue=''; } });
  const cur = document.createElement('span'); cur.className='cur'; cur.textContent='▌';
  root.classList.add('typing');
  let i = 0, k = 0;
  const finish = ()=>{ clearInterval(typeTimer); nodes.forEach(([n,v])=>n.nodeValue=v); cur.remove(); root.classList.remove('typing'); typeSkip = null; revealRest(root); };
  typeSkip = finish;
  typeTimer = setInterval(()=>{
    if (i >= nodes.length) return finish();
    const [n, v] = nodes[i];
    n.nodeValue = v.slice(0, ++k); n.parentNode.insertBefore(cur, n.nextSibling);
    if (k >= v.length){ i++; k = 0; }
  }, TYPE_MS);
}

function dims(){
  const sc = scores(); const n = (x,lo,hi)=>(x-lo)/(hi-lo);
  const shots = {'0':0,'1-10':.25,'11-50':.5,'50+':.75,'museum':1}[A.q9];
  return {
    archive: n(sc.archive,1,5),                                         // 典藏力：Q10
    attach:  n(sc.attach,1,5),                                          // 念舊指數：Q15
    ritual:  n(sc.ritual,1,5),                                          // 儀式需求：Q20
    dig:     .7*n(A.q11,1,4) + .3*(['search','ask'].includes(A.q8b)?1:0), // 考古力：Q11 時光機＋Q8b 會去找備份
    hit:     n(A.q7,1,5),                                               // 404 遭遇度：Q7
    shots,
  };
}

function personaScores(){
  const d = dims();
  return {
    A: .6*d.archive + .4*d.shots,          // 守墓人：自己存
    B: .6*d.ritual  + .4*d.attach,         // 送行者：需要好好告別
    C: .7*d.dig     + .3*d.hit,            // 考古學家：會去挖回來
    D: 1 - (.5*d.attach + .5*d.ritual),    // 過客：放得下
  };
}
function calcPersona(){ const p = personaScores(); return ['A','B','C','D'].reduce((m,k)=>p[k]>p[m]?k:m,'A'); }

  return out.map(s=>`<div>: ${s}</div>`).join('');
}

/* 雷達圖（inline SVG，無外部套件） */
/* 五維度：ANSI 方塊長條（取代雷達圖） */
function dimBars(colors){
  const d = dims(); const C = colors || ['var(--g)','var(--m)','var(--y)','var(--c)','var(--r)'];
  return `<div class="dimbars" role="img" aria-label="五個維度：${DIM_LABEL.map(([k,l])=>l+' '+Math.round(d[k]*100)).join('、')}">` +
    DIM_LABEL.map(([k,l],i)=>{ const v = Math.round(d[k]*100), f = Math.round(v/10);
      return `<div><span>${l}</span><span style="color:${C[i]}">${'█'.repeat(f)}${'░'.repeat(10-f)}</span><b>${v}</b></div>`; }).join('') + `</div>`;
}
function radarSVG({ink, grid, fill, sub}){
  const d = dims(); const N = DIM_LABEL.length; const c = 150, R = 92;
  const pt = (i,r)=>{ const a = -Math.PI/2 + i*2*Math.PI/N; return [c + r*Math.cos(a), c + r*Math.sin(a)]; };
  const ring = r => DIM_LABEL.map((_,i)=>pt(i,r).join(',')).join(' ');
  let s = `<svg class="radar" viewBox="0 0 300 300" role="img" aria-label="五個維度的雷達圖">`;
  [.25,.5,.75,1].forEach(f=> s += `<polygon points="${ring(R*f)}" fill="none" stroke="${grid}" stroke-width="1"/>`);
  DIM_LABEL.forEach((_,i)=>{ const [x,y]=pt(i,R); s += `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="${grid}" stroke-width="1"/>`; });
  const poly = DIM_LABEL.map(([k],i)=>pt(i, R*Math.max(.04, d[k])).join(',')).join(' ');
  s += `<polygon points="${poly}" fill="${fill}" stroke="${ink}" stroke-width="2" stroke-linejoin="round"/>`;
  DIM_LABEL.forEach(([k],i)=>{ const [x,y]=pt(i, R*Math.max(.04,d[k])); s += `<circle cx="${x}" cy="${y}" r="3.5" fill="${ink}"/>`; });
  DIM_LABEL.forEach(([k,l],i)=>{ const [x,y]=pt(i,R+26); s += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="${ink}" font-family="Noto Sans TC,sans-serif">${l}</text><text x="${x}" y="${y+16}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="${sub}" font-family="Noto Sans TC,sans-serif">${Math.round(d[k]*100)}</text>`; });
  return s + `</svg>`;
}

function itemOK(it){
  const v = A[it.id];
  if (!it.req) return true;
  if (it.kind==='multi'){ if(!Array.isArray(v)||!v.length) return false; if(it.other&&v.includes(it.other)&&!(A[it.id+'_other']||'').trim()) return false; return true; }
  if (it.kind==='grid') return v && it.rows.every(([k])=>v[k]);
  return v!==undefined && v!=='';
}
function screenOK(s){
  if (s.type==='consent') return !!(FLAG?.consent && FLAG?.adult);
  if (s.type==='email') return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(EMAIL.trim());
  if (s.type==='q') return s.items.every(itemOK);
  return true;
}

async function rpc(fn, body){
  const r = await fetch(`${CONFIG.SUPABASE_URL.replace(/\/$/,'')}/rest/v1/rpc/${fn}`,{method:'POST',
    headers:{'apikey':CONFIG.SUPABASE_ANON_KEY,'Authorization':'Bearer '+CONFIG.SUPABASE_ANON_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(body)});
  const j = await r.json().catch(()=>null);
  if (!r.ok) throw new Error((j&&j.message)||('HTTP '+r.status));
  return j;
}
function payload(isPtt){
  const ids = new Set(['q1']); S.forEach(s=>{ if(s.type==='q' && visible(s)) s.items.forEach(it=>{ ids.add(it.id); ids.add(it.id+'_other'); }); });
  const ans = {}; for (const k in A) if (ids.has(k)) ans[k] = A[k];
  return {is_ptt_user:isPtt, answers:ans, persona_calc: isPtt ? calcPersona() : null, client_meta:{v:'v12-fun', src:SRC, mobile:matchMedia('(max-width:600px)').matches, lang:navigator.language}};
}

    return;
  }
  if (s.type==='email'){ const inp = app.querySelector('input[type=email]'); if (inp){ inp.focus(); } if (K==='ArrowLeft' && hist.length) backBtn.click(); return; }
  if (s.type==='result' || s.type==='guest'){
    if (K==='s'){ const b = document.querySelector('[data-a="save"]'); if (b){ e.preventDefault(); b.click(); } }
    if (K==='m'){ const b = document.querySelector('[data-a="interview"]'); if (b){ e.preventDefault(); b.scrollIntoView({block:'center'}); b.focus(); } }
    return;
  }
  if (s.type!=='q' || !nav) return;

  const it = kbTarget(s);
  if (it && KB.q!==it.id){ KB.q = it.id; KB.opt = -1; KB.row = -1; }
  if (K==='ArrowLeft'){ if (hist.length){ e.preventDefault(); backBtn.click(); } return; }
  if (K==='y' && s.items.some(i=>i.last)){ e.preventDefault(); goOn(); return; }

  if (it && (it.kind==='single'||it.kind==='multi')){
    const opts = app.querySelectorAll(`.opt[data-q="${it.id}"]`);
    if (K==='ArrowDown'||K==='ArrowUp'){ e.preventDefault(); const n = opts.length;
      KB.opt = KB.opt<0 ? (K==='ArrowDown'?0:n-1) : (KB.opt + (K==='ArrowDown'?1:n-1)) % n; applyKB(); opts[KB.opt].scrollIntoView({block:'nearest'}); return; }
    if (/^[1-9]$/.test(k)){ const b = opts[+k-1]; if (b && !b.disabled){ e.preventDefault(); KB.opt = -1; b.click(); } return; }
    if (K===' ' && KB.opt>=0){ e.preventDefault(); const b = opts[KB.opt]; if (b && !b.disabled) b.click(); return; }   // 空白鍵：選取／取消（複選可來回切換）
    if ((K==='Enter'||K==='ArrowRight') && KB.opt>=0){ e.preventDefault(); const b = opts[KB.opt]; KB.opt = -1;
      if (b && !b.disabled && !b.classList.contains('on')){ b.click(); return; }   // Enter 只「選取」游標所在的選項，不會取消
      applyKB(); }
  } else if (it && it.kind==='scale'){
    const cur = A[it.id];
    if (/^[0-9]$/.test(k) && +k>=it.min && +k<=it.max){ e.preventDefault(); A[it.id] = +k; render(); return; }
    if (K==='ArrowUp'||K==='ArrowDown'){ e.preventDefault(); const v = Math.max(it.min, Math.min(it.max, (cur||Math.ceil((it.min+it.max)/2)) + (K==='ArrowUp'?1:-1))); A[it.id] = v; render(); return; }
  } else if (it && it.kind==='links'){
    const cur = A.q5;
    if (/^[0-9]$/.test(k)){ e.preventDefault(); A.q5 = +k; render(); return; }
    if (K==='ArrowUp'||K==='ArrowDown'){ e.preventDefault(); A.q5 = Math.max(0, Math.min(10, (cur===undefined?5:cur) + (K==='ArrowUp'?1:-1))); render(); return; }
  } else if (it && it.kind==='grid'){
    const rows = it.rows; const g = A[it.id]||{}; const firstEmpty = rows.findIndex(([r])=>!g[r]);
    if (K==='ArrowDown'||K==='ArrowUp'){ e.preventDefault(); const base = KB.row>=0 ? KB.row : (firstEmpty>=0?firstEmpty:0);
      KB.row = KB.row<0 ? base : (base + (K==='ArrowDown'?1:rows.length-1)) % rows.length; applyKB();
      const r = app.querySelectorAll('.grid .row')[KB.row]; if (r) r.scrollIntoView({block:'center'}); return; }
    if (/^[1-9]$/.test(k) && +k<=it.cols.length){ const ri = KB.row>=0 ? KB.row : firstEmpty; if (ri<0) return; e.preventDefault();
      A[it.id] = Object.assign({}, g, {[rows[ri][0]]: +k});
      const g2 = A[it.id]; const nx = rows.findIndex(([r])=>!g2[r]); KB.row = nx; render();
      const r = app.querySelectorAll('.grid .row')[nx>=0?nx:ri]; if (r) r.scrollIntoView({behavior:'smooth',block:'center'}); return; }
  }
  if (K==='Enter'||K==='ArrowRight'){ e.preventDefault(); goOn(); }
});
MQ.addEventListener('change', ()=>render());
window.addEventListener('beforeunload', e=>{ const t=S[idx].type; if(['q','act','reveal'].includes(t)){ e.preventDefault(); e.returnValue=''; } });
render();

/* 標題 glitch：隨機間隔發作，偶爾連發；同時把「別」「░」短暫換成亂碼 */
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const GL = '▓▒░█#%&@$<>/\\_?!01';
  function burst(){
    document.querySelectorAll('.glitch').forEach(el=>{
      el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
      setTimeout(()=>el.classList.remove('on'), 460);
    });
    document.querySelectorAll('.glitch .rot, .scr').forEach(sp=>{
      if (sp.dataset.o == null) sp.dataset.o = sp.textContent;
      const o = sp.dataset.o; let n = 0;
      sp.classList.add('hot');
      const t = setInterval(()=>{
        sp.textContent = [...o].map(()=>GL[Math.random()*GL.length|0]).join('');
        if (++n > 5){ clearInterval(t); sp.textContent = o; sp.classList.remove('hot'); }
      }, 60);
    });
    setTimeout(burst, Math.random() < .3 ? 180 + Math.random()*200 : 1800 + Math.random()*3200);
  }
  setTimeout(burst, 1200);
})();
/* 像素圖動畫：逐格換畫面、星星閃爍，偶爾有一小段像素「腐蝕」成 ░ */
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  setInterval(()=>{
    const now = performance.now(), t = Math.floor(now/450);
    document.querySelectorAll('pre.px[data-art]').forEach(el=>{
      const a = PXF[el.dataset.art]; if (!a) return;
      const i = Math.floor(now/a.ms) % a.f.length, key = i+'_'+t;
      if (el._k !== key){ el._k = key; el.innerHTML = pxRows(a.f[i], t); }
    });
  }, 60);
  setInterval(()=>{
    const els = [...document.querySelectorAll('pre.px')].filter(e=>e.offsetParent); if (!els.length) return;
    const el = els[Math.random()*els.length|0], cs = el.querySelectorAll('.pc'); if (!cs.length) return;
    const c = cs[Math.random()*cs.length|0], o = c.textContent;
    c.textContent = o.replace(/[█▓▒]/g,'░');
    setTimeout(()=>{ if (c.isConnected && c.textContent!==o && /░/.test(c.textContent)) c.textContent = o; }, 180+Math.random()*260);
  }, 700);
})();
